<div class="dashboard-container">
  <!-- Header -->
  <app-header 
    [userEmail]="userEmail" 
    [hasActiveFilter]="hasActiveFilter()"
    (toggleSidebar)="toggleSidebar()"
    (searchQuery)="onSearchQuery($event)"
    (filterByLabel)="onFilterByLabel($event)"
    (filterByColor)="onFilterByColor($event)"
    (clearFilters)="onClearFilters()"
    (toggleView)="handleViewToggle($event)">
  </app-header>

  <!-- Sidebar -->
  <app-sidebar [isExpanded]="isSidebarExpanded"></app-sidebar>

  <!-- Main Content -->
  <main class="main-content" [class.sidebar-collapsed]="!isSidebarExpanded">
    <!-- Take a Note -->
    <div class="take-note-container">
      <div class="take-note" *ngIf="!isCreateNoteExpanded" (click)="expandCreateNote()">
        <input type="text" placeholder="Take a note..." readonly class="take-note-input">
        <div class="take-note-icons">
          <button class="icon-btn-small" aria-label="New list">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z" fill="currentColor"/>
            </svg>
          </button>
          <button class="icon-btn-small" aria-label="New note with drawing">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
            </svg>
          </button>
          <button class="icon-btn-small" aria-label="New note with image">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Expanded Create Note Form -->
      <div class="create-note-form" *ngIf="isCreateNoteExpanded" [style.background-color]="newNote.color">
        <div class="create-note-header">
          <input 
            type="text" 
            [(ngModel)]="newNote.title" 
            placeholder="Title"
            class="note-title-input"
          >
          <button class="icon-btn-small pin-btn" 
                  [class.pinned]="newNote.isPinned" 
                  (click)="toggleNewNotePin(); $event.stopPropagation()"
                  aria-label="Pin note">
            <svg width="24" height="24" viewBox="0 0 24 24">
              <path *ngIf="!newNote.isPinned" d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2z" fill="currentColor"/>
              <path *ngIf="newNote.isPinned" d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2zM9 4v7.75L7.5 14h9L15 11.75V4H9z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <textarea 
          [(ngModel)]="newNote.description" 
          placeholder="Take a note..."
          class="note-description-input"
          rows="3"
        ></textarea>
        <div class="note-actions">
          <div class="note-icons">
            <div class="color-btn-wrapper">
              <button class="icon-btn-small color-btn" aria-label="Change color" (click)="toggleColorPicker($event)">
                <svg width="20" height="20" viewBox="0 0 24 24">
                  <path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3.31-2.69 6-6 6h-1.77c-.28 0-.5.22-.5.5 0 .12.05.23.13.33.41.47.64 1.06.64 1.67 0 1.38-1.12 2.5-2.5 2.5zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8c.28 0 .5-.22.5-.5 0-.16-.08-.28-.14-.35-.41-.46-.63-1.05-.63-1.65 0-1.38 1.12-2.5 2.5-2.5H16c2.21 0 4-1.79 4-4 0-3.86-3.59-7-8-7z" fill="currentColor"/>
                  <circle cx="6.5" cy="11.5" r="1.5" fill="currentColor"/>
                  <circle cx="9.5" cy="7.5" r="1.5" fill="currentColor"/>
                  <circle cx="14.5" cy="7.5" r="1.5" fill="currentColor"/>
                  <circle cx="17.5" cy="11.5" r="1.5" fill="currentColor"/>
                </svg>
              </button>
              
              <!-- Color Picker for Create Note -->
              <div class="color-picker-dropdown" *ngIf="showColorPicker" (click)="$event.stopPropagation()">
                <button 
                  *ngFor="let color of colorPalette" 
                  class="color-option" 
                  [style.background-color]="color.value"
                  [class.selected]="newNote.color === color.value"
                  (click)="changeNewNoteColor(color.value)"
                  [attr.aria-label]="color.name">
                  <svg *ngIf="newNote.color === color.value" width="18" height="18" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
            </div>
            
            <button class="icon-btn-small" (click)="openLabelPickerForNewNote($event)" aria-label="Add label">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z" fill="currentColor"/>
              </svg>
            </button>
            <button class="icon-btn-small" (click)="archiveNewNote(); $event.stopPropagation()" aria-label="Archive">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm3-5h2.55v3h2.9v-3H16l-4-4z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          
          <button class="close-btn" (click)="closeCreateNote()">Close</button>
        </div>
      </div>
    </div>

    <!-- Pinned Notes -->
    <div class="notes-section" *ngIf="pinnedNotes.length > 0">
      <h3 class="section-title">PINNED</h3>
      <div class="notes-grid" [class.list-view]="isListView">
        <div *ngFor="let note of pinnedNotes" class="note-card" [style.background-color]="note.color" (click)="startEditNote(note)">
          <div class="note-header">
            <h4 class="note-title">{{ note.title }}</h4>
            <button class="icon-btn-small pin-btn pinned" (click)="togglePin(note); $event.stopPropagation()" aria-label="Unpin">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <p class="note-description">{{ note.description }}</p>
          
          <!-- Note Labels -->
          <div class="note-labels" *ngIf="getNoteLabels(note.noteId).length > 0">
            <span *ngFor="let label of getNoteLabels(note.noteId)" class="label-chip" (click)="$event.stopPropagation()">
              <span class="label-text">{{ label.name }}</span>
              <button class="label-close" (click)="removeLabelFromNote(note.noteId, label.labelId)" aria-label="Remove label" title="Remove label">
                <svg width="14" height="14" viewBox="0 0 24 24">
                  <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
                </svg>
              </button>
            </span>
          </div>
          
          <div class="note-footer" (click)="$event.stopPropagation()">
            <!-- Remind me - disabled -->
            <button class="icon-btn-small disabled" title="Remind me" aria-label="Remind me" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M18 17v-6c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v6H4v2h16v-2h-2zm-2 0H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6zm-4 5c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2z" fill="currentColor"/>
              </svg>
            </button>
            
            <!-- Collaborator -->
            <button class="icon-btn-small" title="Collaborator" (click)="$event.stopPropagation()" aria-label="Collaborator">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
              </svg>
            </button>
            
            <!-- Background options -->
            <div class="color-btn-wrapper">
              <button class="icon-btn-small" title="Background options" aria-label="Background options" (click)="toggleColorPicker($event)">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3.31-2.69 6-6 6h-1.77c-.28 0-.5.22-.5.5 0 .12.05.23.13.33.41.47.64 1.06.64 1.67 0 1.38-1.12 2.5-2.5 2.5zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8c.28 0 .5-.22.5-.5 0-.16-.08-.28-.14-.35-.41-.46-.63-1.05-.63-1.65 0-1.38 1.12-2.5 2.5-2.5H16c2.21 0 4-1.79 4-4 0-3.86-3.59-7-8-7z" fill="currentColor"/>
                  <circle cx="6.5" cy="11.5" r="1.5" fill="currentColor"/>
                  <circle cx="9.5" cy="7.5" r="1.5" fill="currentColor"/>
                  <circle cx="14.5" cy="7.5" r="1.5" fill="currentColor"/>
                  <circle cx="17.5" cy="11.5" r="1.5" fill="currentColor"/>
                </svg>
              </button>
              
              <div class="color-picker-dropdown" *ngIf="showColorPicker">
                <button 
                  *ngFor="let color of colorPalette" 
                  class="color-option" 
                  [style.background-color]="color.value"
                  [class.selected]="note.color === color.value"
                  (click)="changeColor(note, color.value); $event.stopPropagation()"
                  [attr.aria-label]="color.name">
                  <svg *ngIf="note.color === color.value" width="18" height="18" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
            </div>
            
            <!-- Add image - disabled -->
            <button class="icon-btn-small disabled" title="Add image" aria-label="Add image" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" fill="currentColor"/>
              </svg>
            </button>
            
            <!-- Archive -->
            <button class="icon-btn-small" title="Archive" (click)="archiveNote(note)" aria-label="Archive">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm3-5h2.55v3h2.9v-3H16l-4-4z" fill="currentColor"/>
              </svg>
            </button>
            
            <!-- More menu -->
            <div class="more-menu-wrapper">
              <button class="icon-btn-small" title="More" (click)="toggleMoreMenu(note, $event)" aria-label="More">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" fill="currentColor"/>
                </svg>
              </button>
              
              <!-- More dropdown menu -->
              <div class="more-dropdown" *ngIf="showMoreMenu && activeMoreMenuNoteId === note.noteId" (click)="$event.stopPropagation()">
                <button class="more-menu-item" (click)="deleteNote(note)">
                  <span>Delete note</span>
                </button>
                <button class="more-menu-item" (click)="openLabelPicker(note, $event)">
                  <span>Change labels</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Add drawing</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Make a copy</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Show tick boxes</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Copy to Google Docs</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Version history</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Other Notes -->
    <div class="notes-section" *ngIf="otherNotes.length > 0">
      <h3 class="section-title" *ngIf="pinnedNotes.length > 0">OTHERS</h3>
      <div class="notes-grid" [class.list-view]="isListView">
        <div *ngFor="let note of otherNotes" class="note-card" [style.background-color]="note.color" (click)="startEditNote(note)">
          <div class="note-header">
            <h4 class="note-title">{{ note.title }}</h4>
            <button class="icon-btn-small pin-btn" (click)="togglePin(note); $event.stopPropagation()" aria-label="Pin">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2zM9 4v7.75L7.5 14h9L15 11.75V4H9z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <p class="note-description">{{ note.description }}</p>
          
          <!-- Note Labels -->
          <div class="note-labels" *ngIf="getNoteLabels(note.noteId).length > 0">
            <span *ngFor="let label of getNoteLabels(note.noteId)" class="label-chip" (click)="$event.stopPropagation()">
              <span class="label-text">{{ label.name }}</span>
              <button class="label-close" (click)="removeLabelFromNote(note.noteId, label.labelId)" aria-label="Remove label" title="Remove label">
                <svg width="14" height="14" viewBox="0 0 24 24">
                  <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
                </svg>
              </button>
            </span>
          </div>
          
          <div class="note-footer" (click)="$event.stopPropagation()">
            <!-- Remind me - disabled -->
            <button class="icon-btn-small disabled" title="Remind me" aria-label="Remind me" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M18 17v-6c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v6H4v2h16v-2h-2zm-2 0H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6zm-4 5c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2z" fill="currentColor"/>
              </svg>
            </button>
            
            <!-- Collaborator -->
            <button class="icon-btn-small" title="Collaborator" (click)="$event.stopPropagation()" aria-label="Collaborator">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
              </svg>
            </button>
            
            <div class="color-btn-wrapper">
              <button class="icon-btn-small" aria-label="Change color" (click)="toggleColorPicker($event)">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3.31-2.69 6-6 6h-1.77c-.28 0-.5.22-.5.5 0 .12.05.23.13.33.41.47.64 1.06.64 1.67 0 1.38-1.12 2.5-2.5 2.5zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8c.28 0 .5-.22.5-.5 0-.16-.08-.28-.14-.35-.41-.46-.63-1.05-.63-1.65 0-1.38 1.12-2.5 2.5-2.5H16c2.21 0 4-1.79 4-4 0-3.86-3.59-7-8-7z" fill="currentColor"/>
                  <circle cx="6.5" cy="11.5" r="1.5" fill="currentColor"/>
                  <circle cx="9.5" cy="7.5" r="1.5" fill="currentColor"/>
                  <circle cx="14.5" cy="7.5" r="1.5" fill="currentColor"/>
                  <circle cx="17.5" cy="11.5" r="1.5" fill="currentColor"/>
                </svg>
              </button>
              
              <div class="color-picker-dropdown" *ngIf="showColorPicker">
                <button 
                  *ngFor="let color of colorPalette" 
                  class="color-option" 
                  [style.background-color]="color.value"
                  [class.selected]="note.color === color.value"
                  (click)="changeColor(note, color.value); $event.stopPropagation()"
                  [attr.aria-label]="color.name">
                  <svg *ngIf="note.color === color.value" width="18" height="18" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
            </div>
            <button class="icon-btn-small disabled" title="Add image" aria-label="Add image" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" fill="currentColor"/>
              </svg>
            </button>
            <button class="icon-btn-small" title="Archive" (click)="archiveNote(note)" aria-label="Archive">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm3-5h2.55v3h2.9v-3H16l-4-4z" fill="currentColor"/>
              </svg>
            </button>
            <div class="more-menu-wrapper">
              <button class="icon-btn-small" title="More" (click)="toggleMoreMenu(note, $event)" aria-label="More">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" fill="currentColor"/>
                </svg>
              </button>
              
              <div class="more-dropdown" *ngIf="showMoreMenu && activeMoreMenuNoteId === note.noteId" (click)="$event.stopPropagation()">
                <button class="more-menu-item" (click)="deleteNote(note)">
                  <span>Delete note</span>
                </button>
                <button class="more-menu-item" (click)="openLabelPicker(note, $event)">
                  <span>Change labels</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Add drawing</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Make a copy</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Show tick boxes</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Copy to Google Docs</span>
                </button>
                <button class="more-menu-item disabled" disabled>
                  <span>Version history</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="notes.length === 0">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="#5f6368">
        <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>
      </svg>
      <p>Notes you add appear here</p>
    </div>
  </main>

  <!-- Edit Note Modal -->
  <div class="modal-overlay" *ngIf="editingNote" (click)="onModalOverlayClick($event)">
    <div class="modal-content" [style.background-color]="editingNote.color" (click)="onModalContentClick($event)">
      <div class="modal-header">
        <input 
          type="text" 
          [(ngModel)]="editNoteData.title" 
          placeholder="Title"
          class="modal-title-input"
          [style.background-color]="editingNote.color"
        >
        <button class="icon-btn-small pin-btn" 
                [class.pinned]="editingNote.isPinned" 
                (click)="togglePin(editingNote)"
                aria-label="Pin note">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path *ngIf="!editingNote.isPinned" d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2zM9 4v7.75L7.5 14h9L15 11.75V4H9z" fill="currentColor"/>
            <path *ngIf="editingNote.isPinned" d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <textarea 
        [(ngModel)]="editNoteData.description" 
        placeholder="Take a note..."
        class="modal-description-input"
        rows="5"
        [style.background-color]="editingNote.color"
      ></textarea>
      
      <!-- Note Labels in Edit Modal -->
      <div class="note-labels" *ngIf="getNoteLabels(editingNote.noteId).length > 0">
        <span *ngFor="let label of getNoteLabels(editingNote.noteId)" class="label-chip" (click)="$event.stopPropagation()">
          <span class="label-text">{{ label.name }}</span>
          <button class="label-close" (click)="removeLabelFromNote(editingNote.noteId, label.labelId)" aria-label="Remove label" title="Remove label">
            <svg width="14" height="14" viewBox="0 0 24 24">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
            </svg>
          </button>
        </span>
      </div>
      
      <div class="modal-actions" [class.has-separator]="getNoteLabels(editingNote.noteId).length === 0">
        <div class="modal-icons">
          <!-- Remind me - disabled -->
          <button class="icon-btn-small disabled" title="Remind me" aria-label="Remind me" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M18 17v-6c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v6H4v2h16v-2h-2zm-2 0H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6zm-4 5c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2z" fill="currentColor"/>
            </svg>
          </button>
          
          <!-- Collaborator -->
          <button class="icon-btn-small" title="Collaborator" (click)="$event.stopPropagation()" aria-label="Collaborator">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
            </svg>
          </button>
          
          <div class="color-btn-wrapper">
            <button class="icon-btn-small color-btn" title="Background options" aria-label="Background options" (click)="toggleColorPicker($event)">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3.31-2.69 6-6 6h-1.77c-.28 0-.5.22-.5.5 0 .12.05.23.13.33.41.47.64 1.06.64 1.67 0 1.38-1.12 2.5-2.5 2.5zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8c.28 0 .5-.22.5-.5 0-.16-.08-.28-.14-.35-.41-.46-.63-1.05-.63-1.65 0-1.38 1.12-2.5 2.5-2.5H16c2.21 0 4-1.79 4-4 0-3.86-3.59-7-8-7z" fill="currentColor"/>
                <circle cx="6.5" cy="11.5" r="1.5" fill="currentColor"/>
                <circle cx="9.5" cy="7.5" r="1.5" fill="currentColor"/>
                <circle cx="14.5" cy="7.5" r="1.5" fill="currentColor"/>
                <circle cx="17.5" cy="11.5" r="1.5" fill="currentColor"/>
              </svg>
            </button>
            
            <!-- Color Picker for Edit Modal -->
            <div class="color-picker-dropdown" *ngIf="showColorPicker">
              <button 
                *ngFor="let color of colorPalette" 
                class="color-option" 
                [style.background-color]="color.value"
                [class.selected]="editingNote.color === color.value"
                (click)="changeEditNoteColor(color.value)"
                [attr.aria-label]="color.name">
                <svg *ngIf="editingNote.color === color.value" width="18" height="18" viewBox="0 0 24 24">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
          
          <!-- Add image - disabled -->
          <button class="icon-btn-small disabled" title="Add image" aria-label="Add image" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" fill="currentColor"/>
            </svg>
          </button>
          
          <button class="icon-btn-small" title="Archive" (click)="archiveNote(editingNote)" aria-label="Archive">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm3-5h2.55v3h2.9v-3H16l-4-4z" fill="currentColor"/>
            </svg>
          </button>
          
          <div class="more-menu-wrapper">
            <button class="icon-btn-small" title="More" (click)="toggleMoreMenu(editingNote, $event)" aria-label="More">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" fill="currentColor"/>
              </svg>
            </button>
            
            <div class="more-dropdown" *ngIf="showMoreMenu && editingNote && activeMoreMenuNoteId === editingNote.noteId" (click)="$event.stopPropagation()">
              <button class="more-menu-item" (click)="deleteNote(editingNote)">
                <span>Delete note</span>
              </button>
              <button class="more-menu-item" (click)="openLabelPicker(editingNote, $event)">
                <span>Change labels</span>
              </button>
              <button class="more-menu-item disabled" disabled>
                <span>Add drawing</span>
              </button>
              <button class="more-menu-item disabled" disabled>
                <span>Make a copy</span>
              </button>
              <button class="more-menu-item disabled" disabled>
                <span>Show tick boxes</span>
              </button>
              <button class="more-menu-item disabled" disabled>
                <span>Copy to Google Docs</span>
              </button>
              <button class="more-menu-item disabled" disabled>
                <span>Version history</span>
              </button>
            </div>
          </div>
          
          <!-- Undo - disabled -->
          <button class="icon-btn-small disabled" title="Undo" aria-label="Undo" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z" fill="currentColor"/>
            </svg>
          </button>
          
          <!-- Redo - disabled -->
          <button class="icon-btn-small disabled" title="Redo" aria-label="Redo" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        
        <button class="close-btn" (click)="closeEditNote()">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Label Picker -->
<app-label-picker 
  *ngIf="showLabelPicker && labelPickerNoteId"
  [noteId]="labelPickerNoteId"
  [attachedLabelIds]="getAttachedLabelIds(labelPickerNoteId)"
  [showInfoMessage]="showLabelInfoMessage"
  [style.top]="labelPickerPosition.top"
  [style.left]="labelPickerPosition.left"
  (close)="closeLabelPicker()"
  (labelsChanged)="onLabelsChanged()"
  (dismissInfoMessage)="dismissLabelInfoMessage()">
</app-label-picker>>
