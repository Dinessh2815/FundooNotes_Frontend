<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="reset-password-header">
      <img src="/assets/google-logo-removebg-preview.png" alt="Google" class="google-logo">
      <h2>Reset Password</h2>
      <p>Enter your new password</p>
    </div>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-password-form">
      <div class="form-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="newPassword"
          formControlName="newPassword"
          placeholder="New Password*"
          class="form-input"
          [class.error]="newPassword?.invalid && newPassword?.touched"
        />
        <div class="error-message" *ngIf="newPassword?.invalid && newPassword?.touched">
          <span *ngIf="newPassword?.errors?.['required']">Password is required</span>
          <span *ngIf="newPassword?.errors?.['minlength']">Use 6 or more characters</span>
        </div>
      </div>

      <div class="form-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="Confirm Password*"
          class="form-input"
          [class.error]="confirmPassword?.invalid && confirmPassword?.touched"
        />
        <div class="error-message" *ngIf="confirmPassword?.invalid && confirmPassword?.touched">
          <span *ngIf="confirmPassword?.errors?.['required']">Please confirm your password</span>
          <span *ngIf="confirmPassword?.errors?.['passwordMismatch']">Passwords don't match</span>
        </div>
      </div>

      <div class="success-message" *ngIf="successMessage">
        <span>{{ successMessage }}</span>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span>{{ errorMessage }}</span>
      </div>

      <div class="form-actions">
        <a routerLink="/login" class="back-link">Back to Sign in</a>
        <button type="submit" class="btn-primary" [disabled]="isLoading || !token">
          {{ isLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
