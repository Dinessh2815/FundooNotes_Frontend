<div class="label-view-container">
  <!-- Header -->
  <app-header [userEmail]="userEmail" (toggleSidebar)="toggleSidebar()"></app-header>

  <!-- Sidebar -->
  <app-sidebar [isExpanded]="isSidebarExpanded"></app-sidebar>

  <!-- Main Content -->
  <main class="main-content" [class.sidebar-collapsed]="!isSidebarExpanded">
    <div class="label-header" *ngIf="label">
      <svg width="32" height="32" viewBox="0 0 24 24" class="label-icon">
        <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z" fill="currentColor"/>
      </svg>
      <h2>{{ label.name }}</h2>
    </div>

    <!-- Notes Grid -->
    <div class="notes-section" *ngIf="notes.length > 0">
      <div class="notes-grid">
        <div *ngFor="let note of notes" class="note-card" [style.background-color]="note.color">
          <div class="note-header">
            <h4 class="note-title">{{ note.title }}</h4>
            <button 
              class="icon-btn-small pin-btn" 
              [class.pinned]="note.isPinned"
              (click)="togglePin(note); $event.stopPropagation()" 
              aria-label="Pin">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path *ngIf="note.isPinned" d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2z" fill="currentColor"/>
                <path *ngIf="!note.isPinned" d="M17 4v7l2 3v2h-6v5l-1 1-1-1v-5H5v-2l2-3V4c0-1.1.9-2 2-2h6c1.11 0 2 .89 2 2zM9 4v7.75L7.5 14h9L15 11.75V4H9z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <p class="note-description">{{ note.description }}</p>
          <div class="note-footer" (click)="$event.stopPropagation()">
            <button class="icon-btn-small" (click)="archiveNote(note)" aria-label="Archive">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm3-5h2.55v3h2.9v-3H16l-4-4z" fill="currentColor"/>
              </svg>
            </button>
            <button class="icon-btn-small" (click)="deleteNote(note)" aria-label="Delete">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="notes.length === 0 && label">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="#5f6368">
        <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
      </svg>
      <p>No notes with this label</p>
    </div>
  </main>
</div>
