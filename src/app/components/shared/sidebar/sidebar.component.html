<aside class="sidebar" [class.collapsed]="!isExpanded">
  <nav class="nav-menu">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z" fill="currentColor"/>
      </svg>
      <span *ngIf="isExpanded">Notes</span>
    </a>
    
    <a routerLink="/reminders" routerLinkActive="active" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M18 17v-6c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v6H4v2h16v-2h-2zm-2 0H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6zm-4 5c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2z" fill="currentColor"/>
      </svg>
      <span *ngIf="isExpanded">Reminders</span>
    </a>
    
    <a (click)="openEditLabelsModal()" class="nav-item" style="cursor: pointer;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <path d="M20.41 4.94l-1.35-1.35c-.78-.78-2.05-.78-2.83 0L13.4 6.41 3 16.82V21h4.18l10.46-10.46 2.77-2.77c.79-.78.79-2.05 0-2.83zm-14 14.12L5 19v-1.36l9.82-9.82 1.41 1.41-9.82 9.83z"></path>      
      </svg>
      <span *ngIf="isExpanded">Edit labels</span>
    </a>
    
    <a routerLink="/archive" routerLinkActive="active" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.81 1H5.44l.8-1zM5 19V8h14v11H5z" fill="currentColor"/>
      </svg>
      <span *ngIf="isExpanded">Archive</span>
    </a>
    
    <a routerLink="/bin" routerLinkActive="active" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5zm2 15H7V6h10v13z" fill="currentColor"/>
        <path d="M9 8h2v9H9zm4 0h2v9h-2z" fill="currentColor"/>
      </svg>
      <span *ngIf="isExpanded">Bin</span>
    </a>
    
    <div class="labels-section" *ngIf="isExpanded && labels.length > 0">
      <div class="labels-header">LABELS</div>
      <a *ngFor="let label of labels" [routerLink]="['/label', label.labelId]" routerLinkActive="active" class="nav-item label-item">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z" fill="currentColor"/>
        </svg>
        <span>{{ label.name }}</span>
      </a>
    </div>
  </nav>
</aside>

<!-- Edit Labels Modal -->
<app-edit-labels-modal 
  *ngIf="showEditLabelsModal" 
  (close)="closeEditLabelsModal()">
</app-edit-labels-modal>
