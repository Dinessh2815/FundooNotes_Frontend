<header class="header">
  <div class="header-left">
    <button class="menu-btn" aria-label="Menu" (click)="onMenuClick()">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
      </svg>
    </button>
    <img src="/assets/keep.png" alt="Keep" class="logo">
    <span class="app-title">Keep</span>
  </div>
  
  <div class="header-center">
    <div class="search-container">
      <!-- Mobile: Toggle between search icon and search bar -->
      <ng-container *ngIf="screenIsMobile; else desktopSearch">
        <div class="search-bar" [class.mobile-collapsed]="!showMobileSearch" [class.active]="showSearchPreview">
          <button class="icon-btn" aria-label="Search" (click)="showMobileSearch = !showMobileSearch" *ngIf="!showMobileSearch">
            <svg width="24" height="24" viewBox="0 0 24 24" class="search-icon">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
            </svg>
          </button>
          <input 
            *ngIf="showMobileSearch"
            type="text" 
            placeholder="Search" 
            class="search-input"
            [(ngModel)]="searchText"
            (focus)="onSearchFocus()"
            (input)="onSearchInput()"
            autofocus>
          <button *ngIf="searchText && showMobileSearch" class="close-search-btn" (click)="closeSearch()" aria-label="Clear search">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </ng-container>
      <ng-template #desktopSearch>
        <div class="search-bar" [class.active]="showSearchPreview">
          <svg width="24" height="24" viewBox="0 0 24 24" class="search-icon">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
          </svg>
          <input 
            type="text" 
            placeholder="Search" 
            class="search-input"
            [(ngModel)]="searchText"
            (focus)="onSearchFocus()"
            (input)="onSearchInput()">
          <button *ngIf="searchText" class="close-search-btn" (click)="closeSearch()" aria-label="Clear search">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
            </svg>
          </button>
          <button *ngIf="hasActiveFilter && !searchText" class="close-search-btn filter-close" (click)="clearAllFilters()" aria-label="Clear filter" title="Clear filter">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </ng-template>
    </div>
  </div>

  <div class="header-right">
    <button class="icon-btn" aria-label="Refresh" (click)="refreshPage()">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
      </svg>
    </button>
      <button class="icon-btn" *ngIf="!screenIsMobile" [attr.aria-label]="isListView ? 'Grid view' : 'List view'" (click)="toggleViewMode()" [title]="isListView ? 'Grid view' : 'List view'">
        <svg *ngIf="!isListView" width="24" height="24" viewBox="0 0 24 24">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor"/>
        </svg>
        <svg *ngIf="isListView" width="24" height="24" viewBox="0 0 24 24">
          <path d="M4 14h4v-4H4v4zm0 5h4v-4H4v4zM4 9h4V5H4v4zm5 5h12v-4H9v4zm0 5h12v-4H9v4zM9 5v4h12V5H9z" fill="currentColor"/>
        </svg>
      </button>
    <button class="icon-btn" aria-label="Toggle dark mode" (click)="toggleDarkMode()">
      <svg *ngIf="!isDarkMode" width="24" height="24" viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" fill="currentColor"/>
      </svg>
      <svg *ngIf="isDarkMode" width="24" height="24" viewBox="0 0 24 24">
        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" fill="currentColor"/>
      </svg>
    </button>
    <div class="profile-dropdown-container">
      <button class="icon-btn user-btn" (click)="toggleProfileDropdown()" aria-label="Account">
        <span class="user-initial">{{ (userEmail || 'U')[0].toUpperCase() }}</span>
      </button>
      <!-- Profile Dropdown -->
      <div class="profile-dropdown" *ngIf="showProfileDropdown">
        <div class="dropdown-email">{{ userEmail }}</div>
        <button class="dropdown-logout" (click)="logout()">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" fill="currentColor"/>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </div>

  <!-- Overlay to close dropdowns -->
  <div class="overlay" *ngIf="showSearchPreview || showProfileDropdown" (click)="showSearchPreview = false; showProfileDropdown = false"></div>
</header>
