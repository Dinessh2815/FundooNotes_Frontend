<div class="bin-container">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="menu-btn icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
        </svg>
      </button>
      <img src="assets/keep.png" alt="Keep" class="logo">
      <span class="logo-text">Keep</span>
    </div>

    <div class="header-center">
      <div class="search-bar">
        <button class="search-icon icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M20.49,19l-5.73-5.73C15.53,12.2,16,10.91,16,9.5C16,5.91,13.09,3,9.5,3S3,5.91,3,9.5C3,13.09,5.91,16,9.5,16c1.41,0,2.7-0.47,3.77-1.24L19,20.49L20.49,19z M5,9.5C5,7.01,7.01,5,9.5,5S14,7.01,14,9.5S11.99,14,9.5,14S5,11.99,5,9.5z" fill="currentColor"/>
          </svg>
        </button>
        <input type="text" placeholder="Search" class="search-input">
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn" aria-label="Refresh">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Settings">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M13.85 22.25h-3.7c-.74 0-1.36-.54-1.45-1.27l-.27-1.89c-.27-.14-.53-.29-.79-.46l-1.8.72c-.7.26-1.47-.03-1.81-.65L2.2 15.53c-.35-.66-.2-1.44.36-1.88l1.53-1.19c-.01-.15-.02-.3-.02-.46 0-.15.01-.31.02-.46l-1.52-1.19c-.59-.45-.74-1.26-.37-1.88l1.85-3.19c.34-.62 1.11-.9 1.79-.63l1.81.73c.26-.17.52-.32.78-.46l.27-1.91c.09-.7.71-1.25 1.44-1.25h3.7c.74 0 1.36.54 1.45 1.27l.27 1.89c.27.14.53.29.79.46l1.8-.72c.71-.26 1.48.03 1.82.65l1.84 3.18c.36.66.2 1.44-.36 1.88l-1.52 1.19c.01.15.02.3.02.46s-.01.31-.02.46l1.52 1.19c.56.45.72 1.23.37 1.86l-1.86 3.22c-.34.62-1.11.9-1.8.63l-1.8-.72c-.26.17-.52.32-.78.46l-.27 1.91c-.1.68-.72 1.22-1.46 1.22zm-3.23-2h2.76l.37-2.55.53-.22c.44-.18.88-.44 1.34-.78l.45-.34 2.38.96 1.38-2.4-2.03-1.58.07-.56c.03-.26.06-.51.06-.78s-.03-.53-.06-.78l-.07-.56 2.03-1.58-1.39-2.4-2.39.96-.45-.35c-.42-.32-.87-.58-1.33-.77l-.52-.22-.37-2.55h-2.76l-.37 2.55-.53.21c-.44.19-.88.44-1.34.79l-.45.33-2.38-.95-1.39 2.39 2.03 1.58-.07.56a7 7 0 0 0-.06.79c0 .26.02.53.06.78l.07.56-2.03 1.58 1.38 2.4 2.39-.96.45.35c.43.33.86.58 1.33.77l.53.22.38 2.55z" fill="currentColor"/>
          <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
        </svg>
      </button>
      <button class="account-btn" aria-label="Account">
        <span class="account-initial">{{ (userEmail || 'U')[0].toUpperCase() }}</span>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <nav>
      <a routerLink="/dashboard" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z" fill="currentColor"/>
        </svg>
        <span>Notes</span>
      </a>
      <a routerLink="/reminders" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M18 17v-6c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v6H4v2h16v-2h-2zm-2 0H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6zm-4 5c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2z" fill="currentColor"/>
        </svg>
        <span>Reminders</span>
      </a>
      <a href="#" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z" fill="currentColor"/>
        </svg>
        <span>Edit labels</span>
      </a>
      <a routerLink="/archive" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.81 1H5.44l.8-1zM5 19V8h14v11H5z" fill="currentColor"/>
        </svg>
        <span>Archive</span>
      </a>
      <a routerLink="/bin" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5zm2 15H7V6h10v13z" fill="currentColor"/>
          <path d="M9 8h2v9H9zm4 0h2v9h-2z" fill="currentColor"/>
        </svg>
        <span>Bin</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="bin-header">
      <h2>Bin</h2>
      <p class="bin-description">Notes in Bin are deleted forever after 7 days.</p>
    </div>

    <!-- Deleted Notes -->
    <div class="notes-section" *ngIf="deletedNotes.length > 0">
      <div class="notes-grid">
        <div *ngFor="let note of deletedNotes" class="note-card" [style.background-color]="note.color">
          <div class="note-header">
            <h4 class="note-title">{{ note.title }}</h4>
          </div>
          <p class="note-description">{{ note.description }}</p>
          <div class="note-footer" (click)="$event.stopPropagation()">
            <button class="icon-btn-small" (click)="restoreNote(note)" aria-label="Restore" title="Restore">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" fill="currentColor"/>
              </svg>
            </button>
            <button class="icon-btn-small" (click)="permanentDeleteNote(note)" aria-label="Delete forever" title="Delete forever">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="deletedNotes.length === 0">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="#5f6368">
        <path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5zm2 15H7V6h10v13z"/>
        <path d="M9 8h2v9H9zm4 0h2v9h-2z"/>
      </svg>
      <p>No notes in Bin</p>
    </div>
  </main>
</div>
