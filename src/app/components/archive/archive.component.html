<div class="archive-container">
  <!-- Header -->
  <app-header [userEmail]="userEmail" (toggleSidebar)="toggleSidebar()"></app-header>

  <!-- Sidebar -->
  <app-sidebar [isExpanded]="isSidebarExpanded"></app-sidebar>

  <!-- Main Content -->
  <main class="main-content" [class.sidebar-collapsed]="!isSidebarExpanded">
    <div class="archive-content">
      <h2 class="page-title">Archive</h2>
      
      <!-- Archived Notes -->
      <div class="notes-grid" *ngIf="archivedNotes.length > 0">
        <div *ngFor="let note of archivedNotes" class="note-card" [style.background-color]="note.color">
          <div class="note-header">
            <h4 class="note-title">{{ note.title }}</h4>
          </div>
          <p class="note-description">{{ note.description }}</p>
          <div class="note-footer">
            <button class="icon-btn-small" (click)="unarchiveNote(note)" aria-label="Unarchive">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm3-3h2.55v-3h2.9v3H16l-4 4z" fill="currentColor"/>
              </svg>
            </button>
            <button class="icon-btn-small" (click)="deleteNote(note)" aria-label="Delete">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="archivedNotes.length === 0">
        <svg width="120" height="120" viewBox="0 0 24 24" fill="#5f6368">
          <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27z"/>
        </svg>
        <p>Your archived notes appear here</p>
      </div>
    </div>
  </main>
</div>
